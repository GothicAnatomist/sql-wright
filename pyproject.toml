[project]
name = "sql-wright"
version = "0.1.0"
description = "Package to provide SQL string parsing, generation and translation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 72

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PD"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = 'src'

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pytest>=8.3.5",
    "ruff>=0.9.10",
]
